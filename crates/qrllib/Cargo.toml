[package]
name = "qrllib"
version = "0.1.4"
edition = "2024"
description = "Rust QRL primitives, wallet helpers, and ML-DSA-87 implementation for native and wasm use"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["qrl", "post-quantum", "cryptography", "ml-dsa-87", "wallet"]
categories = ["cryptography"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
getrandom.workspace = true
hex.workspace = true
sha2.workspace = true
sha3.workspace = true
shake.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }

[features]
# Opt-in to the SPHINCS+/SLH-DSA wallet path (TOB-QRLLIB-4).
#
# The QRL wallet layer treats SPHINCS+ as **not a production wallet type**:
# the implementation here is the pre-FIPS-205 SPHINCS+ submission, QRL
# has not yet committed to a specific SLH-DSA parameter set under
# FIPS 205, and activating the wallet path now would commit users to a
# parameter set that may change. `WalletType::SphincsPlus256s` is
# therefore `is_valid() == is_issuable() == is_verifiable() == false`,
# matching go-qrllib's `wallettype` gates. Without this feature, wallet
# constructors return `WalletTypeNotIssuable` and
# `verify_sphincsplus_wallet_signature` returns `false`.
#
# Use of the raw `SphincsPlus256s` primitive directly, outside the wallet
# layer, remains unrestricted.
#
# In-crate tests get the enabled behaviour automatically via
# `cfg(any(test, feature = "experimental-sphincsplus-issuance"))`.
experimental-sphincsplus-issuance = []
