[workspace]
members = [
    "crates/qrllib",
    "crates/qrllib-wasm",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/theQRL/rust-qrllib"

[workspace.dependencies]
aes = "=0.9.3"
getrandom = "=0.2.17"
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha1 = "=0.11.0"
serde-wasm-bindgen = "=0.6.5"
sha2 = "=0.11.1"
sha3 = "=0.12.0"
shake = { version = "=0.1.0", features = ["zeroize"] }
thiserror = "=2.0.21"
wasm-bindgen = "=0.2.118"
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
